<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tehir Kodu Sorgu</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f3f6f7;--card:#fff;--ink:#14272e;--mut:#5b7078;--teal:#25687a;--line:#d5e0e4;--bad:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1b1f;--card:#16272d;--ink:#e6f0f3;--mut:#93a8af;--teal:#4aa3b9;--line:#28404a;--bad:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:22px;margin:8px 0 4px}
.sub{color:var(--mut);margin:0 0 18px;font-size:14px}
#q{width:100%;padding:12px 14px;font:inherit;font-size:22px;letter-spacing:.06em;text-transform:uppercase;border:2px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
#pw{padding:8px 12px;font:inherit;border:2px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);width:160px}
#q:focus,#pw:focus,button:focus-visible{outline:3px solid var(--teal);outline-offset:1px}
.res{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.row{display:grid;grid-template-columns:110px 1fr;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.row b{background:var(--teal);color:#fff;padding:10px 12px;font-weight:600}
.row span{padding:10px 12px}
.none{margin-top:16px;color:var(--bad);font-weight:600}
.bar{margin-top:32px;padding-top:14px;border-top:1px solid var(--line);color:var(--mut);font-size:14px}
.rw{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
button{padding:8px 14px;border:1px solid var(--teal);background:transparent;color:var(--teal);border-radius:8px;font:inherit;cursor:pointer}
button.fill{background:var(--teal);color:#fff}
button.warn{border-color:var(--bad);color:var(--bad)}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<h1>Tehir kodu sorgu</h1>
<p class="sub" id="info"></p>
<input id="q" placeholder="Kod yazın, örn. 31P" autocomplete="off" aria-label="Tehir kodu">
<div id="out"></div>

<div class="bar">
  <button id="adm">Yönetici</button> <span id="msg"></span>
  <div class="rw" id="login" hidden><input id="pw" type="password" placeholder="Şifre" aria-label="Şifre"><button class="fill" id="ok">Giriş</button></div>
  <div class="rw" id="panel" hidden>
    <input type="file" id="file" accept=".xlsx,.xls,.xlsm" hidden>
    <button class="fill" id="load">Excel yükle (listeyi değiştir)</button>
    <button class="warn" id="del">Listeyi sil</button>
    <button id="reset">Varsayılan listeye dön</button>
    <button id="exit">Çıkış</button>
  </div>
</div>
</main>

<script>
const $=id=>document.getElementById(id);
const norm=s=>String(s==null?"":s).trim().toUpperCase().replace(/\s+/g,"");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function parseTsv(t){const rows=[];let r=[],c="",q=false;
 for(let i=0;i<t.length;i++){const ch=t[i];
  if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
  else if(ch==='"'&&c==="")q=true;
  else if(ch==="\t"){r.push(c);c=""}
  else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&t[i+1]==="\n")i++;r.push(c);rows.push(r);r=[];c=""}
  else c+=ch}
 if(c!==""||r.length){r.push(c);rows.push(r)}
 return rows.map(x=>x.map(s=>s.trim())).filter(x=>x[0]&&!/^TEH[İI]R/i.test(x[0])).map(x=>[x[0],x[1]||"",x[2]||"",x[3]||""])}

const SEED=parseTsv($("veri").textContent);
let data=SEED,over=false,map;
try{const s=localStorage.getItem("tehir-data");if(s){const d=JSON.parse(s);if(Array.isArray(d)){data=d;over=true}}}catch(e){}
function save(){try{localStorage.setItem("tehir-data",JSON.stringify(data))}catch(e){}}

function build(){map=new Map();data.forEach(r=>map.set(norm(r[0]),r));
 $("info").textContent=!data.length?"Liste boş":data.length+" tehir kodu"+(over?" (bu cihazda değiştirilmiş liste)":"");
 one()}
function one(){const k=norm($("q").value),o=$("out");
 if(!k){o.innerHTML="";return}
 const r=map.get(k);
 o.innerHTML=r?'<div class="res"><div class="row"><b>TEHİR KODU</b><span>'+esc(r[0])+'</span></div><div class="row"><b>SORUMLU</b><span>'+esc(r[1])+'</span></div><div class="row"><b>BİRİM</b><span>'+esc(r[2])+'</span></div><div class="row"><b>AÇIKLAMA</b><span>'+esc(r[3])+'</span></div></div>':'<div class="none">Bulunamadı: '+esc($("q").value.trim())+'</div>'}
$("q").oninput=one;

$("adm").onclick=()=>{if(!$("panel").hidden)return;$("login").hidden=!$("login").hidden;$("pw").focus()};
$("ok").onclick=()=>{if($("pw").value==="1453"){$("login").hidden=true;$("panel").hidden=false;$("pw").value="";$("msg").textContent=""}else $("msg").textContent="Şifre yanlış."};
$("pw").onkeydown=e=>{if(e.key==="Enter")$("ok").click()};
$("exit").onclick=()=>{$("panel").hidden=true;$("msg").textContent=""};

let armed=false;
$("del").onclick=()=>{
 if(!armed){armed=true;$("del").textContent="Emin misiniz? Tekrar basın";setTimeout(()=>{armed=false;$("del").textContent="Listeyi sil"},4000);return}
 armed=false;$("del").textContent="Listeyi sil";data=[];over=true;save();$("msg").textContent="Liste silindi.";build()};
$("reset").onclick=()=>{data=SEED;over=false;try{localStorage.removeItem("tehir-data")}catch(e){}$("msg").textContent="Varsayılan liste geri yüklendi.";build()};

$("load").onclick=()=>$("file").click();
$("file").onchange=e=>{const f=e.target.files[0];if(!f)return;
 const rd=new FileReader();
 rd.onload=()=>{try{
  const wb=XLSX.read(rd.result,{type:"array"});
  const name=wb.SheetNames.find(n=>n.toLocaleUpperCase("tr")==="LİSTE")||wb.SheetNames[0];
  const rows=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,defval:""});
  let h=rows.findIndex(r=>r.some(c=>/TEH[İI]R/i.test(String(c))));if(h<0)h=0;
  const hdr=rows[h].map(c=>String(c).toLocaleUpperCase("tr"));
  const ix=k=>hdr.findIndex(c=>c.includes(k));
  let a=ix("TEHİR"),b=ix("SORUMLU"),c=ix("BİRİM"),d=ix("AÇIKLAMA");
  if([a,b,c,d].some(x=>x<0)){const s=rows[h].findIndex(x=>String(x).trim()!=="");a=s;b=s+1;c=s+2;d=s+3}
  const cl=v=>String(v==null?"":v).replace(/\s+/g," ").trim();
  const out=rows.slice(h+1).filter(r=>cl(r[a])).map(r=>[cl(r[a]),cl(r[b]),cl(r[c]),cl(r[d])]);
  if(!out.length)throw new Error("boş");
  data=out;over=true;save();$("msg").textContent=out.length+" kod yüklendi ("+name+" sayfası).";build()
 }catch(x){$("msg").textContent="Dosya okunamadı. Sütunlar: Tehir Kodları, Sorumlu, Birim, Açıklama olmalı."}};
 rd.readAsArrayBuffer(f);e.target.value=""};
build();
</script>
</body>
