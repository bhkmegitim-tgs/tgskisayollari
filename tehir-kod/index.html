<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tehir kodu sorgu</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{color-scheme:dark;--bg:#0f1a20;--card:#17252c;--line:#2a3d46;--acc:#4aa3ba;--tx:#f2f6f8;--mut:#8fa3ad;--err:#ff7b7b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1090px;margin:0 auto;padding:40px 20px 60px}
h1{margin:0 0 6px;font-size:28px}
.head{display:flex;align-items:center;gap:18px;margin-bottom:24px}.head .sub{margin-bottom:0}.logo{height:64px;width:auto;background:#fff;border-radius:10px;padding:6px 10px;flex:none}
.sub{color:var(--mut);margin-bottom:24px}
input,textarea{width:100%;background:var(--card);color:var(--tx);border:2px solid var(--line);border-radius:10px;font:inherit;padding:10px 14px;outline:none}
input:focus,textarea:focus{border-color:var(--acc)}
#q{font-size:28px;padding:16px 22px;text-transform:uppercase}
table{width:100%;border-collapse:separate;border-spacing:0;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:24px}
th{background:var(--acc);color:#fff;text-align:left;padding:16px 18px;width:165px;font-size:18px;vertical-align:top}
td{padding:16px 18px;font-size:18px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
tr:not(:last-child) th{border-bottom:1px solid #3a8aa0}
.list{margin-top:24px;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.item{display:flex;gap:16px;padding:12px 18px;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border-bottom:0}.item:hover{background:#1d313a}
.item b{min-width:70px;color:var(--acc)}.item span{color:var(--mut)}
.msg{margin-top:24px;color:var(--mut)}
#q2{font-size:20px;padding:14px 22px;margin-top:16px}
.rt{margin-top:8px}.rt th{width:auto;font-size:15px;padding:12px 14px}.rt td{font-size:16px;padding:12px 14px}
.rt tr[data-k]{cursor:pointer}.rt tr[data-k]:hover td{background:#1d313a}
hr{border:0;border-top:1px solid var(--line);margin:36px 0 22px}
button{font:inherit;cursor:pointer;border-radius:8px;padding:10px 18px;border:1px solid var(--acc);background:transparent;color:var(--acc)}
button.p{background:var(--acc);color:#fff}
button.d{border-color:var(--err);color:var(--err)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:12px}
.row input{width:240px}
.err{color:var(--err)}
#admin{display:none;margin-top:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
textarea{min-height:110px;font-size:14px;margin-top:12px}
small{color:var(--mut)}
@media(max-width:600px){th{width:110px;font-size:15px;padding:12px}td{font-size:16px;padding:12px}#q{font-size:22px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><div><h1>Tehir kodu sorgu</h1>
  <div class="sub" id="count"></div></div></div>
  <input id="q" placeholder="Kod yaz… (örn. 31P)" autocomplete="off" autofocus>
  <div id="out"></div>
  <input id="q2" placeholder="Açıklamada ara… (kelime veya cümle)" autocomplete="off">
  <div id="out2"></div>

  <hr>
  <div class="row"><button id="yb">Yönetici</button><span id="ymsg"></span></div>
  <div class="row" id="login"><input id="pw" type="password" placeholder="Şifre"><button class="p" id="gb">Giriş</button></div>

  <div id="admin">
    <div class="grid">
      <input id="f_kod" placeholder="Tehir kodu">
      <input id="f_sor" placeholder="Sorumlu">
      <input id="f_bir" placeholder="Birim">
      <input id="f_ack" placeholder="Açıklama">
    </div>
    <div class="row">
      <button class="p" id="save">Kaydet / Güncelle</button>
      <button class="d" id="del">Sil</button>
      <button id="xl">Excel indir</button>
      <button id="exp">Dışa aktar</button>
      <button id="imp">İçe aktar</button>
      <button id="cikis">Çıkış</button>
    </div>
    <textarea id="bulk" placeholder="Toplu yükleme: her satıra KOD;SORUMLU;BİRİM;AÇIKLAMA (Excel'den 4 sütunu kopyalayıp da yapıştırabilirsin)"></textarea>
    <small>Not: Veriler bu tarayıcıda saklanır. Dışa aktar ile listeyi kutuya döker, kopyalayıp yedekleyebilirsin.</small>
  </div>
</div>

var codes;
try{ var s=localStorage.getItem(KEY); codes = s ? JSON.parse(s) : DEFAULTS.slice(); }catch(e){ codes = DEFAULTS.slice(); }
if(!Array.isArray(codes)) codes = DEFAULTS.slice();
var isAdmin=false;
var $=function(i){return document.getElementById(i)};

function persist(){ try{ localStorage.setItem(KEY, JSON.stringify(codes)); }catch(e){} }
function esc(t){ var d=document.createElement("div"); d.textContent=t==null?"":t; return d.innerHTML; }
function norm(t){ return (t||"").toLocaleUpperCase("tr").trim(); }

function render(){
  $("count").textContent = codes.length + " tehir kodu";
  var q = norm($("q").value), out = $("out");
  if(!q){ out.innerHTML=""; return; }
  var exact = codes.find(function(c){ return norm(c.kod)===q; });
  if(exact){
    out.innerHTML = "<table><tr><th>TEHİR KODU</th><td>"+esc(exact.kod)+"</td></tr><tr><th>SORUMLU</th><td>"+esc(exact.sorumlu)+"</td></tr><tr><th>BİRİM</th><td>"+esc(exact.birim)+"</td></tr><tr><th>AÇIKLAMA</th><td>"+esc(exact.aciklama)+"</td></tr></table>";
    fillForm(exact); return;
  }
  var m = codes.filter(function(c){ return norm(c.kod).indexOf(q)===0 || norm(c.aciklama).indexOf(q)>-1; }).slice(0,30);
  if(!m.length){ out.innerHTML = '<div class="msg">Kayıt bulunamadı.</div>'; return; }
  out.innerHTML = '<div class="list">'+m.map(function(c,i){ return '<div class="item" data-k="'+esc(c.kod)+'"><b>'+esc(c.kod)+'</b><span>'+esc(c.birim)+' · '+esc(c.aciklama)+'</span></div>'; }).join("")+'</div>';
}
function fillForm(c){ $("f_kod").value=c.kod; $("f_sor").value=c.sorumlu; $("f_bir").value=c.birim; $("f_ack").value=c.aciklama; }

$("q").addEventListener("input", render);
function aramaAck(){
  var w = norm($("q2").value).replace(/\s+/g," "), o = $("out2");
  if(!w){ o.innerHTML=""; return; }
  var m = codes.filter(function(c){ return norm(c.aciklama).replace(/\s+/g," ").indexOf(w)>-1; });
  if(!m.length){ o.innerHTML='<div class="msg">Kayıt bulunamadı.</div>'; return; }
  o.innerHTML = '<div class="msg">'+m.length+' sonuç'+(m.length>100?' (ilk 100 gösteriliyor)':'')+'</div><div style="overflow-x:auto"><table class="rt"><tr><th>TEHİR KODU</th><th>SORUMLU</th><th>BİRİM</th><th>AÇIKLAMA</th></tr>'+
    m.slice(0,100).map(function(c){ return '<tr data-k="'+esc(c.kod)+'"><td><b>'+esc(c.kod)+'</b></td><td>'+esc(c.sorumlu)+'</td><td>'+esc(c.birim)+'</td><td>'+esc(c.aciklama)+'</td></tr>'; }).join("")+'</table></div>';
}
$("q2").addEventListener("input", aramaAck);
$("out2").addEventListener("click", function(e){
  var r = e.target.closest("tr[data-k]"); if(!r) return;
  $("q").value = r.getAttribute("data-k"); render(); window.scrollTo(0,0);
});
$("out").addEventListener("click", function(e){
  var it = e.target.closest(".item"); if(!it) return;
  $("q").value = it.getAttribute("data-k"); render();
});

function excelIndir(){
  if(typeof XLSX==="undefined"){ $("ymsg").innerHTML='<span class="err">Excel kütüphanesi yüklenemedi.</span>'; return; }
  if(!(window.claude && claude.use)){ $("ymsg").innerHTML='<span class="err">Bu görünümde indirme kapalı.</span>'; return; }
  claude.use("downloads").then(function(dl){
    if(!dl){ $("ymsg").innerHTML='<span class="err">Bu görünümde indirme kapalı.</span>'; return; }
    var rows = codes.map(function(c){ return {"TEHİR KODLARI":c.kod,"SORUMLU":c.sorumlu,"TEHİR KATEGORİ":c.kategori||"","KATEGORİSORUMLUSU":c.katsor||"","KONTROL DIŞI":c.kdisi||"","BİRİM":c.birim,"AÇIKLAMA":c.aciklama}; });
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), "LİSTE");
    var buf = XLSX.write(wb,{bookType:"xlsx",type:"array"});
    return dl.save({filename:"TEHIR_KODLARI.xlsx", data:new Blob([buf])});
  }).catch(function(e){ if(e && e.code!=="declined") $("ymsg").innerHTML='<span class="err">İndirme başarısız.</span>'; });
}
$("xl").onclick = excelIndir;
$("yb").onclick = function(){ if(!isAdmin){ $("login").style.display="flex"; $("pw").focus(); } };
function login(){
  if($("pw").value===ADMIN_PW){ isAdmin=true; $("admin").style.display="block"; $("login").style.display="none"; $("ymsg").textContent=""; $("pw").value=""; excelIndir(); }
  else { $("ymsg").innerHTML='<span class="err">Şifre yanlış.</span>'; }
}
$("gb").onclick = login;
$("pw").addEventListener("keydown", function(e){ if(e.key==="Enter") login(); });
$("cikis").onclick = function(){ isAdmin=false; $("admin").style.display="none"; $("login").style.display="none"; };
// başlangıçta giriş kutusu gizli
$("login").style.display="none";

$("save").onclick = function(){
  var k = $("f_kod").value.trim(); if(!k) return;
  var rec = {kod:k, sorumlu:$("f_sor").value.trim(), birim:$("f_bir").value.trim(), aciklama:$("f_ack").value.trim()};
  var i = codes.findIndex(function(c){ return norm(c.kod)===norm(k); });
  if(i>-1) codes[i]=Object.assign({},codes[i],rec); else codes.push(rec);
  persist(); $("q").value=k; render();
};
$("del").onclick = function(){
  var k = norm($("f_kod").value);
  var i = codes.findIndex(function(c){ return norm(c.kod)===k; });
  if(i>-1 && confirm(k+" silinsin mi?")){ codes.splice(i,1); persist(); $("q").value=""; render(); }
};
$("exp").onclick = function(){
  $("bulk").value = codes.map(function(c){ return [c.kod,c.sorumlu,c.birim,c.aciklama].join(";"); }).join("\n");
  $("bulk").select();
};
$("imp").onclick = function(){
  var lines = $("bulk").value.split(/\r?\n/), n=0;
  lines.forEach(function(l){
    if(!l.trim()) return;
    var p = l.split(/\t|;/).map(function(x){return x.trim();});
    if(!p[0] || norm(p[0])==="TEHİR KODU" || norm(p[0])==="KOD") return;
    var rec = {kod:p[0], sorumlu:p[1]||"", birim:p[2]||"", aciklama:p.slice(3).join(" ")};
    var i = codes.findIndex(function(c){ return norm(c.kod)===norm(rec.kod); });
    if(i>-1) codes[i]=rec; else codes.push(rec);
    n++;
  });
  persist(); render(); $("bulk").value=""; $("ymsg").textContent = n+" kayıt işlendi.";
};
render();
</script>
