<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ekip Vardiya Takvimi</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  html, body { height: 100%; margin: 0; background: #f7f9fd; }
  #vardiyaApp { height: 100vh; height: 100dvh; font-family: 'Inter', Roboto, 'Segoe UI', system-ui, sans-serif; }
  #vardiyaApp {
    --bg: #f7f9fd; --card: #ffffff; --ink: #14213d; --muted: #6b7388; --line: #e3e8f2;
    --navy: #274b7a; --soft: #eaf0fb;
    --S: #e8b341; --O: #dc6b42; --G: #3550ae; --I: #3f9b67;
    flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
    background: var(--bg); color: var(--ink);
    font-family: Roboto, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif;
  }
  #vardiyaApp * { box-sizing: border-box; }
  #vardiyaApp button { font-family: inherit; cursor: pointer; }
  #vardiyaApp button:focus-visible { outline: 3px solid var(--navy); outline-offset: 2px; }

  /* Masaüstü: tek ekrana sığan iki sütun */
  #vardiyaApp .app {
    height: 100%; max-width: 1280px; margin: 0 auto; padding: 14px 24px 16px;
    display: grid; grid-template-columns: minmax(340px, 400px) 1fr; gap: 22px;
  }
  #vardiyaApp .col-l { display: flex; flex-direction: column; gap: 10px; min-height: 0; overflow-y: auto; padding-right: 2px; }
  #vardiyaApp .col-r { display: flex; flex-direction: column; min-height: 0; }

  #vardiyaApp .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  #vardiyaApp .top small { display: block; font-size: 13px; font-weight: 600; color: var(--muted); }
  #vardiyaApp .top h1 { margin: 2px 0 0; font-size: 26px; font-weight: 800; line-height: 1.1; }
  #vardiyaApp .badge {
    flex: none; width: 48px; height: 48px; border-radius: 14px;
    display: grid; place-items: center; background: var(--navy); color: #fff; font-size: 24px; font-weight: 800;
  }
  #vardiyaApp .tabs {
    padding: 4px; border-radius: 16px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; background: #e9ecf5;
  }
  #vardiyaApp .tabs button {
    border: 0; background: transparent; border-radius: 12px; height: 40px; font-size: 17px; font-weight: 700; color: var(--muted);
  }
  #vardiyaApp .tabs button[aria-selected="true"] { background: #fff; color: var(--navy); box-shadow: 0 1px 4px rgba(20,33,61,0.12); }

  #vardiyaApp .picker {
    padding: 8px 12px; border-radius: 16px; display: flex; align-items: center; gap: 10px;
    background: var(--card); border: 1px solid var(--line);
  }
  #vardiyaApp .picker label { flex: 1; display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 700; color: var(--muted); }
  #vardiyaApp .picker input {
    flex: 1; min-width: 0; height: 40px; padding: 0 10px;
    border: 1px solid #cfd8ea; border-radius: 10px; background: #fff;
    font: 600 16px Roboto, 'Segoe UI', system-ui, sans-serif; color: var(--ink);
  }
  #vardiyaApp .picker button {
    height: 40px; padding: 0 16px; border: 0; border-radius: 10px;
    background: var(--navy); color: #fff; font-size: 15px; font-weight: 700;
  }

  #vardiyaApp .today {
    padding: 10px 14px; border-radius: 16px; display: flex; align-items: center; gap: 12px;
    background: var(--card); border: 1px solid var(--line); border-left: 6px solid var(--c, var(--O));
  }
  #vardiyaApp .today-ico {
    flex: none; width: 46px; height: 46px; border-radius: 12px;
    display: grid; place-items: center; color: #fff; font-size: 22px; font-weight: 800; background: var(--c, var(--O));
  }
  #vardiyaApp .today-txt { flex: 1; min-width: 0; }
  #vardiyaApp .today-txt span { display: block; font-size: 13px; color: var(--muted); font-weight: 500; }
  #vardiyaApp .today-txt b { display: block; font-size: 19px; font-weight: 800; margin-top: 2px; }
  #vardiyaApp .today-chip {
    flex: none; padding: 6px 12px; border-radius: 10px; font-weight: 800; font-size: 17px; color: var(--c, var(--O));
    background: color-mix(in srgb, var(--c, var(--O)) 14%, #fff);
  }

  #vardiyaApp .all { padding: 10px 14px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); }
  #vardiyaApp .all h3 { margin: 0 0 4px; font-size: 16px; font-weight: 800; }
  #vardiyaApp .all-row { display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-radius: 10px; font-size: 16px; }
  #vardiyaApp .all-row i { width: 13px; height: 13px; border-radius: 50%; background: var(--c); flex: none; }
  #vardiyaApp .all-row span { flex: 1; color: var(--muted); font-weight: 500; }
  #vardiyaApp .all-row b { font-weight: 800; }
  #vardiyaApp .all-row.mine { background: color-mix(in srgb, var(--c) 14%, #fff); }
  #vardiyaApp .all-row.mine span { color: var(--ink); }

  #vardiyaApp .export { padding: 10px 14px 12px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); margin-top: auto; }
  #vardiyaApp .export h3 { margin: 0 0 2px; font-size: 16px; font-weight: 800; }
  #vardiyaApp .export p { margin: 0 0 8px; font-size: 13px; color: var(--muted); }
  #vardiyaApp .export div { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  #vardiyaApp .export button { height: 42px; border-radius: 12px; font-size: 15px; font-weight: 700; border: 1px solid #cfd8ea; background: var(--soft); color: var(--navy); }
  #vardiyaApp .export button.primary { background: var(--navy); border-color: var(--navy); color: #fff; }

  /* Sağ sütun: takvim */
  #vardiyaApp .month { display: flex; align-items: center; justify-content: space-between; }
  #vardiyaApp .month h2 { margin: 0; font-size: 24px; font-weight: 800; }
  #vardiyaApp .nav-btn {
    width: 44px; height: 44px; border: 0; border-radius: 12px; background: var(--soft); color: var(--navy); font-size: 22px; font-weight: 800;
  }
  #vardiyaApp .counts {
    margin-top: 10px; padding: 8px 6px; border-radius: 16px;
    display: grid; grid-template-columns: repeat(4, 1fr); text-align: center;
    background: var(--card); border: 1px solid var(--line);
  }
  #vardiyaApp .counts i { display: block; width: 10px; height: 10px; border-radius: 50%; margin: 0 auto 3px; }
  #vardiyaApp .counts b { display: block; font-size: 22px; font-weight: 800; line-height: 1.1; }
  #vardiyaApp .counts span { font-size: 13px; color: var(--muted); }
  #vardiyaApp .dow, #vardiyaApp .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  #vardiyaApp .dow { margin-top: 12px; text-align: center; font-size: 13px; font-weight: 700; color: var(--muted); }
  #vardiyaApp .grid { margin-top: 6px; flex: 1; min-height: 0; grid-auto-rows: 1fr; }
  #vardiyaApp .day {
    border: 0; padding: 0; border-radius: 12px; color: #fff; min-height: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-weight: 800; font-size: clamp(14px, 2.3vh, 22px); line-height: 1.15;
  }
  #vardiyaApp .day { opacity: .72; transition: opacity .15s, transform .15s; }
  #vardiyaApp .day:hover { opacity: 1; }
  #vardiyaApp .day.sel-d {
    opacity: 1; position: relative; z-index: 2; transform: scale(1.08);
    outline: 4px solid #14213d; outline-offset: 1px;
    box-shadow: 0 0 0 3px #fff, 0 8px 20px rgba(20,33,61,.45);
    font-size: clamp(16px, 2.7vh, 26px);
  }
  #vardiyaApp .day.sel-d::after {
    content: ""; position: absolute; top: 5px; right: 5px; width: 9px; height: 9px;
    border-radius: 50%; background: #fff; box-shadow: 0 0 0 2px #14213d;
  }
  #vardiyaApp .day.empty { visibility: hidden; cursor: default; }
  #vardiyaApp .S { background: var(--S); }
  #vardiyaApp .O { background: var(--O); }
  #vardiyaApp .G { background: var(--G); }
  #vardiyaApp .I { background: var(--I); }
  #vardiyaApp .legend { margin-top: 10px; padding: 8px 14px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  #vardiyaApp .legend h3 { margin: 0; font-size: 15px; font-weight: 800; }
  #vardiyaApp .legend ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 15px; }
  #vardiyaApp .legend li::before { content: ""; display: inline-block; width: 13px; height: 13px; border-radius: 50%; margin-right: 6px; vertical-align: -2px; background: var(--c); }

  /* Kısa ekranlar: biraz daha sıkı */
  @media (max-height: 760px) and (min-width: 900px) {
    #vardiyaApp .app { padding-top: 8px; padding-bottom: 8px; }
    #vardiyaApp .top h1 { font-size: 22px; }
    #vardiyaApp .badge { width: 40px; height: 40px; font-size: 20px; }
    #vardiyaApp .all-row { padding: 3px 10px; font-size: 15px; }
    #vardiyaApp .legend { display: none; }
  }

  /* Telefon / dar ekran: tek sütun, doğal kaydırma */
  @media (max-width: 899px) {
    #vardiyaApp .app { display: block; height: auto; max-width: 520px; padding: 18px 14px 36px; }
    #vardiyaApp .col-l, #vardiyaApp .col-r { display: block; overflow: visible; }
    #vardiyaApp .col-l > * { margin-bottom: 10px; }
    #vardiyaApp .col-r { margin-top: 8px; }
    #vardiyaApp .grid { grid-auto-rows: auto; }
    #vardiyaApp .day { aspect-ratio: 1 / 1.02; font-size: 17px; }
    #vardiyaApp .export { margin-top: 12px; }
    #vardiyaApp .legend { margin-top: 12px; }
  }


  @media print {
    #vardiyaApp { height: auto; overflow: visible; background: #fff; }
    #vardiyaApp .app { display: block; height: auto; }
    #vardiyaApp .col-l, #vardiyaApp .nav-btn, #vardiyaApp .export { display: none; }
    #vardiyaApp .grid { grid-auto-rows: auto; }
    #vardiyaApp .day { opacity: 1; aspect-ratio: 1 / 0.8; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    #vardiyaApp .counts, #vardiyaApp .legend { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>
<div id="vardiyaApp">
<main class="app">

      <div class="col-l">
        <div class="top">
          <div>
            <small>Ekip vardiya takvimi</small>
            <h1>Vardiyanız hazır</h1>
          </div>
          <div class="badge" id="badge">A</div>
        </div>

        <div class="tabs" role="tablist" aria-label="Ekip seçimi" id="tabs"></div>

        <div class="picker">
          <label>Tarih <input type="date" id="dateIn" aria-label="Tarih seç"></label>
          <button type="button" id="todayBtn">Bugün</button>
        </div>

        <div class="today" id="today"></div>

        <div class="all" id="all"></div>

        <div class="export">
          <h3>Aylık programı dışa aktar</h3>
          <p id="exportSub"></p>
          <div>
            <button id="pdfBtn" type="button">PDF</button>
            <button id="csvBtn" type="button" class="primary">Excel</button>
          </div>
        </div>
      </div>

      <div class="col-r">
        <div class="month">
          <button class="nav-btn" id="prev" aria-label="Önceki ay">‹</button>
          <h2 id="monthTitle"></h2>
          <button class="nav-btn" id="next" aria-label="Sonraki ay">›</button>
        </div>

        <div class="counts" id="counts"></div>

        <div class="dow" aria-hidden="true">
          <span>Pzt</span><span>Sal</span><span>Çar</span><span>Per</span><span>Cum</span><span>Cmt</span><span>Paz</span>
        </div>
        <div class="grid" id="grid"></div>

        <div class="legend">
          <h3>Vardiya renkleri</h3>
          <ul>
            <li style="--c:var(--S)">Sabah</li><li style="--c:var(--O)">Orta</li>
            <li style="--c:var(--G)">Gece</li><li style="--c:var(--I)">İzin</li>
          </ul>
        </div>
      </div>

    </main>
</div>

<script>
(function () {

  // ---- AYARLAR ----
  // Her ekip 8 günlük döngüyü izler: 2 gün Sabah, 2 gün Orta, 2 gün Gece, 2 gün İzin.
  // Döngünün başlangıcı: A ekibi için 6 Kasım 2026 = Sabah'ın ilk günü (uygulamadan doğrulandı).
  // B, C, D ekiplerinin kayma değerleri (gün) aşağıdadır. Uygulamayla farklıysa sadece bu sayıları değiştir.
  const CYCLE = ['S','S','O','O','G','G','I','I'];
  const ANCHOR = Date.UTC(2026, 10, 6);
  const TEAMS = { A: 0, B: 2, C: 4, D: 6 };
  // -----------------

  const INFO = {
    S: { name: 'Sabah', letter: 'S', color: 'var(--S)' },
    O: { name: 'Orta',  letter: 'O', color: 'var(--O)' },
    G: { name: 'Gece',  letter: 'G', color: 'var(--G)' },
    I: { name: 'İzin',  letter: 'İ', color: 'var(--I)' }
  };
  const MONTHS = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];

  const now = new Date();
  let team = 'A';
  try { const s = localStorage.getItem('vardiya-ekip'); if (s && TEAMS[s] !== undefined) team = s; } catch (e) {}
  let year = now.getFullYear(), month = now.getMonth();

  const mod = (n, m) => ((n % m) + m) % m;
  function shiftOf(t, y, m, d) {
    const days = Math.round((Date.UTC(y, m, d) - ANCHOR) / 86400000);
    return CYCLE[mod(days + TEAMS[t], 8)];
  }

  const $ = id => document.getElementById(id);

  function renderTabs() {
    $('tabs').innerHTML = Object.keys(TEAMS).map(t =>
      `<button role="tab" type="button" data-t="${t}" aria-selected="${t === team}">${t}</button>`).join('');
    $('tabs').querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
      team = b.dataset.t;
      try { localStorage.setItem('vardiya-ekip', team); } catch (e) {}
      render();
    }));
  }

  const DOW = ['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
  let sel = { y: now.getFullYear(), m: now.getMonth(), d: now.getDate() };
  let followToday = true;
  const pad = n => String(n).padStart(2, '0');

  function isTodayDate(s) {
    const n = new Date();
    return s.y === n.getFullYear() && s.m === n.getMonth() && s.d === n.getDate();
  }

  function render() {
    renderTabs();
    $('badge').textContent = team;
    $('dateIn').value = `${sel.y}-${pad(sel.m + 1)}-${pad(sel.d)}`;

    const k = shiftOf(team, sel.y, sel.m, sel.d);
    const i = INFO[k];
    const isNow = isTodayDate(sel);
    const wd = DOW[new Date(sel.y, sel.m, sel.d).getDay()];
    const card = $('today');
    card.style.setProperty('--c', i.color);
    card.innerHTML =
      `<div class="today-ico">◔</div>
       <div class="today-txt"><span>${isNow ? 'Bugün · ' : ''}${sel.d} ${MONTHS[sel.m]} ${sel.y} ${wd}</span>
       <b>${team} Ekibi · ${i.name}</b></div>
       <div class="today-chip">${i.letter}</div>`;

    let rows = '';
    ['S','O','G','I'].forEach(s => {
      const who = Object.keys(TEAMS).filter(t2 => shiftOf(t2, sel.y, sel.m, sel.d) === s);
      rows += `<div class="all-row${who.includes(team) ? ' mine' : ''}" style="--c:${INFO[s].color}"><i></i><span>${INFO[s].name}</span><b>${who.map(w => w + ' Ekibi').join(', ')}</b></div>`;
    });
    $('all').innerHTML = `<h3>${isNow ? 'Bugün çalışan ekipler' : sel.d + ' ' + MONTHS[sel.m] + ' günü ekipler'}</h3>${rows}`;

    $('monthTitle').textContent = `${MONTHS[month]} ${year}`;
    const dim = new Date(year, month + 1, 0).getDate();
    const lead = (new Date(year, month, 1).getDay() + 6) % 7;
    const counts = { S: 0, O: 0, G: 0, I: 0 };
    let cells = '<div class="day empty"></div>'.repeat(lead);
    for (let d = 1; d <= dim; d++) {
      const s = shiftOf(team, year, month, d);
      counts[s]++;
      const isSel = d === sel.d && month === sel.m && year === sel.y;
      cells += `<button type="button" class="day ${s}${isSel ? ' sel-d' : ''}" data-d="${d}" aria-label="${d} ${MONTHS[month]}, ${INFO[s].name}"><span>${d}</span><span>${INFO[s].letter}</span></button>`;
    }
    $('grid').innerHTML = cells;
    $('grid').querySelectorAll('button.day').forEach(b => b.addEventListener('click', () => {
      sel = { y: year, m: month, d: +b.dataset.d };
      followToday = isTodayDate(sel);
      render();
    }));

    $('counts').innerHTML = ['S','O','G','I'].map(s =>
      `<div><i style="background:${INFO[s].color}"></i><b>${counts[s]}</b><span>${INFO[s].name}</span></div>`).join('');

    $('exportSub').textContent = `${team} Ekibi · ${MONTHS[month]} ${year}`;
  }

  $('dateIn').addEventListener('change', e => {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(e.target.value);
    if (!m) return;
    sel = { y: +m[1], m: +m[2] - 1, d: +m[3] };
    year = sel.y; month = sel.m;
    followToday = isTodayDate(sel);
    render();
  });

  function goToday() {
    const n = new Date();
    sel = { y: n.getFullYear(), m: n.getMonth(), d: n.getDate() };
    year = sel.y; month = sel.m;
    followToday = true;
    render();
  }
  $('todayBtn').addEventListener('click', goToday);

  document.addEventListener('visibilitychange', () => { if (!document.hidden && followToday && !isTodayDate(sel)) goToday(); });
  setInterval(() => { if (followToday && !isTodayDate(sel)) goToday(); }, 60000);

  $('prev').addEventListener('click', () => { month--; if (month < 0) { month = 11; year--; } render(); });
  $('next').addEventListener('click', () => { month++; if (month > 11) { month = 0; year++; } render(); });

  $('pdfBtn').addEventListener('click', () => window.print());

  $('csvBtn').addEventListener('click', () => {
    const dim = new Date(year, month + 1, 0).getDate();
    const gun = ['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
    let csv = 'Tarih;Gün;Vardiya\r\n';
    for (let d = 1; d <= dim; d++) {
      const dt = new Date(year, month, d);
      csv += `${String(d).padStart(2,'0')}.${String(month+1).padStart(2,'0')}.${year};${gun[dt.getDay()]};${INFO[shiftOf(team, year, month, d)].name}\r\n`;
    }
    const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${team}-ekibi-${MONTHS[month]}-${year}.csv`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });

  render();

})();
</script>
</body>
</html>
