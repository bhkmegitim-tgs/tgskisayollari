<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EYS Emniyet Yönetim Sistemi Sınavı</title>
<style>
:root{--bg:#f4f5fb;--fg:#1a1a2e;--card:#ffffff;--bd:#d5d8ee;--ac:#1f2a6b;--ok:#1b7f3b;--okbg:#e3f4e8;--bad:#a61b1b;--badbg:#fbe5e5}
@media (prefers-color-scheme:dark){:root{--bg:#12131c;--fg:#e8e9f5;--card:#1c1e2e;--bd:#33365a;--ac:#9aa6ff;--ok:#6fdc8c;--okbg:#18351f;--bad:#ff8a8a;--badbg:#3a1c1c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,Arial,sans-serif;line-height:1.5;padding:env(safe-area-inset-top,0px) 14px env(safe-area-inset-bottom,0px)}
.wrap{max-width:780px;margin:0 auto;padding:12px 0 40px}
h1{color:var(--ac);font-size:1.25rem;margin:8px 0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px 16px;margin:12px 0}
.info{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.92rem}
button{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:12px 20px;font-size:1rem;cursor:pointer}
button:disabled{opacity:.5}
.q{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin:10px 0}
.q h3{font-size:1rem;margin:2px 0 8px}
label{display:block;padding:8px 10px;border-radius:8px;border:1px solid var(--bd);margin:6px 0;cursor:pointer}
label:hover{border-color:var(--ac)}
input[type=radio]{margin-right:8px}
.res-ok{background:var(--okbg);border-color:var(--ok);color:var(--ok);font-weight:600}
.res-bad{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.score{font-size:2rem;font-weight:800;color:var(--ac)}
.pass{color:var(--ok);font-weight:700}.fail{color:var(--bad);font-weight:700}
.note{font-size:.85rem;opacity:.8}
.hidden{display:none}
.explain{font-size:.9rem;margin-top:6px}
</style>
</head>
<body>
<div class="wrap">

<div id="start" class="card">
  <h1>Emniyet Yönetim Sistemi (EYS / SMS) Sınavı</h1>
  <div class="info">
    <span><b>25 soru</b> (havuzdan rastgele)</span>
    <span><b>5 şık</b> (A-E)</span>
    <span><b>Soru başı 4 puan</b></span>
    <span><b>Toplam 100 puan</b></span>
    <span><b>Geçme notu: 90</b></span>
  </div>
  <p class="note">Her girişte soru seti yeniden karıştırılır. Sınav bitince puanınız, yanlış cevaplarınız ve doğru cevaplar gösterilir.</p>
  <div><label>Ad Soyad <input id="ad" type="text" style="width:100%;padding:8px;margin-top:4px"></label></div>
  <div><label>Sicil No <input id="sicil" type="text" style="width:100%;padding:8px;margin-top:4px"></label></div>
  <button id="startBtn" onclick="startExam()">Sınavı Başlat</button>
</div>

<div id="exam" class="hidden">
  <div class="card info"><span id="progress"></span><span id="who" class="note"></span></div>
  <form id="form" onsubmit="return false"></form>
  <div class="card"><button onclick="finish()">Sınavı Bitir ve Sonucu Gör</button></div>
</div>

<div id="result" class="hidden">
  <div class="card" style="text-align:center">
    <div class="score" id="score"></div>
    <div id="verdict"></div>
    <p id="counts" class="note"></p>
    <button onclick="startExam()">Yeni Sınav (yeni rastgele set)</button>
  </div>
  <div id="review"></div>
</div>

</div>

const PASS = 90, PTS = 4, N = 25;
let current = [];

function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const L = "ABCDE";

function startExam(){
  const ad = document.getElementById('ad').value.trim();
  const sicil = document.getElementById('sicil').value.trim();
  if(!ad || !sicil){ alert('Lütfen ad soyad ve sicil numarası giriniz.'); return; }
  const picked = shuffle(POOL).slice(0, N);
  current = picked.map(q => {
    // şıkları karıştır, doğru cevabın yeni yerini takip et
    const idx = shuffle(q[1].map((_,i)=>i));
    const opts = idx.map(i => q[1][i]);
    const correct = idx.indexOf(q[2]);
    return {q: q[0], opts, correct};
  });
  document.getElementById('who').textContent = ad + ' | Sicil: ' + sicil;
  const f = document.getElementById('form');
  f.innerHTML = current.map((item,i) =>
    '<div class="q"><h3>' + (i+1) + '. ' + esc(item.q) + '</h3>' +
    item.opts.map((o,k)=>'<label><input type="radio" name="q'+i+'" value="'+k+'">'+L[k]+') '+esc(o)+'</label>').join('') +
    '</div>').join('');
  document.getElementById('start').classList.add('hidden');
  document.getElementById('result').classList.add('hidden');
  document.getElementById('exam').classList.remove('hidden');
  document.getElementById('progress').textContent = 'Toplam ' + N + ' soru | Her soru ' + PTS + ' puan';
  window.scrollTo(0,0);
}

function esc(s){ return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function finish(){
  const unanswered = current.findIndex((_,i)=> !document.querySelector('input[name="q'+i+'"]:checked'));
  if(unanswered !== -1 && !confirm('Bazı sorular boş. Yine de bitirmek istiyor musunuz?')) return;
  let correctCount = 0, review = [];
  current.forEach((item,i)=>{
    const sel = document.querySelector('input[name="q'+i+'"]:checked');
    const chosen = sel ? parseInt(sel.value,10) : -1;
    const ok = chosen === item.correct;
    if(ok) correctCount++;
    review.push('<div class="q"><h3>' + (i+1) + '. ' + esc(item.q) + '</h3>' +
      item.opts.map((o,k)=>{
        let cls = '';
        if(k===item.correct) cls='res-ok';
        else if(k===chosen) cls='res-bad';
        return '<label class="'+cls+'">'+L[k]+') '+esc(o)+(k===item.correct?' ✔':'')+(k===chosen&&!ok?' ✘ (sizin cevabınız)':'')+'</label>';
      }).join('') +
      (chosen===-1 ? '<p class="note">Bu soru boş bırakıldı.</p>' : '') +
      '<p class="explain"><b>Doğru cevap: '+L[item.correct]+')</b> '+(ok?'Doğru':'Yanlış')+'</p></div>');
  });
  const score = correctCount * PTS;
  const wrong = N - correctCount;
  document.getElementById('score').textContent = score + ' / 100';
  document.getElementById('verdict').innerHTML = score >= PASS
    ? '<span class="pass">GEÇTİNİZ (geçme notu '+PASS+')</span>'
    : '<span class="fail">KALDINIZ (geçme notu '+PASS+')</span>';
  document.getElementById('counts').textContent = 'Doğru: ' + correctCount + '  |  Yanlış/boş: ' + wrong;
  document.getElementById('review').innerHTML = '<h2 style="color:var(--ac)">Sınav Değerlendirmesi</h2>' + review.join('');
  document.getElementById('exam').classList.add('hidden');
  document.getElementById('result').classList.remove('hidden');
  window.scrollTo(0,0);
}
</script>
</body>
</html>
