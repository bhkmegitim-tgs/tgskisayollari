<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EYS Emniyet Yönetim Sistemi Sınavı</title>
<style>
:root{--bg:#f4f5fb;--fg:#1a1a2e;--card:#ffffff;--bd:#d5d8ee;--ac:#1f2a6b;--ok:#1b7f3b;--okbg:#e3f4e8;--bad:#a61b1b;--badbg:#fbe5e5}
@media (prefers-color-scheme:dark){:root{--bg:#12131c;--fg:#e8e9f5;--card:#1c1e2e;--bd:#33365a;--ac:#9aa6ff;--ok:#6fdc8c;--okbg:#18351f;--bad:#ff8a8a;--badbg:#3a1c1c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,Arial,sans-serif;line-height:1.5;padding:env(safe-area-inset-top,0px) 14px env(safe-area-inset-bottom,0px)}
.wrap{max-width:780px;margin:0 auto;padding:12px 0 40px}
h1{color:var(--ac);font-size:1.25rem;margin:8px 0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px 16px;margin:12px 0}
.info{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.92rem}
button{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:12px 20px;font-size:1rem;cursor:pointer}
button:disabled{opacity:.5}
.q{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin:10px 0}
.q h3{font-size:1rem;margin:2px 0 8px}
label{display:block;padding:8px 10px;border-radius:8px;border:1px solid var(--bd);margin:6px 0;cursor:pointer}
label:hover{border-color:var(--ac)}
input[type=radio]{margin-right:8px}
.res-ok{background:var(--okbg);border-color:var(--ok);color:var(--ok);font-weight:600}
.res-bad{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.score{font-size:2rem;font-weight:800;color:var(--ac)}
.pass{color:var(--ok);font-weight:700}.fail{color:var(--bad);font-weight:700}
.note{font-size:.85rem;opacity:.8}
.hidden{display:none}
.explain{font-size:.9rem;margin-top:6px}
</style>
</head>
<body>
<div class="wrap">

<div id="start" class="card">
  <h1>Emniyet Yönetim Sistemi (EYS / SMS) Sınavı</h1>
  <div class="info">
    <span><b>25 soru</b> (havuzdan rastgele)</span>
    <span><b>5 şık</b> (A-E)</span>
    <span><b>Soru başı 4 puan</b></span>
