<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BHKM - Kural İhlal Takip Sistemi</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary-color: #e67e22; /* TGS Turuncu Tonu */
            --dark-color: #2c3e50;
            --light-bg: #f5f7fa;
            --success-color: #27ae60;
            --danger-color: #e74c3c;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        html, body {
            background-color: var(--light-bg);
            color: var(--dark-color);
            padding: 10px;
            overflow-x: hidden; /* Yatay taşmayı tamamen engeller */
            width: 100%;
        }
        .container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        @media (min-width: 600px) {
            body { padding: 20px; }
            .container { padding: 30px; }
        }
        .header {
            text-align: center;
            border-bottom: 3px solid var(--primary-color);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }
        .header h1 {
            font-size: 20px;
            color: var(--dark-color);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        @media (min-width: 600px) {
            .header h1 { font-size: 24px; }
        }
        .header p {
            font-size: 13px;
            color: #7f8c8d;
            margin-top: 5px;
        }
        .section-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--primary-color);
            margin-bottom: 15px;
            border-left: 4px solid var(--primary-color);
            padding-left: 8px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr; /* Mobilde tek sütun */
            gap: 15px;
            margin-bottom: 25px;
        }
        @media (min-width: 600px) {
            .form-grid { grid-template-columns: 1fr 1fr; } /* Masaüstünde çift sütun */
        }
        .form-group {
            display: flex;
            flex-direction: column;
            width: 100%;
        }
        label {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 5px;
            color: #34495e;
        }
        input, select, textarea {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
            width: 100%; /* İçeriğin dışarı taşmasını önler */
            max-width: 100%;
        }
        input:focus, select:focus, textarea:focus {
            border-color: var(--primary-color);
        }
        input[readonly] {
            background-color: #f0f3f4;
            color: #7f8c8d;
            cursor: not-allowed;
        }
        .btn-group {
            display: flex;
            flex-direction: column; /* Mobilde butonlar alt alta */
            gap: 10px;
            margin-top: 20px;
        }
        @media (min-width: 600px) {
            .btn-group {
                flex-direction: row; /* Masaüstünde yan yana */
                gap: 15px;
            }
        }
        button {
            width: 100%;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover {
            opacity: 0.9;
        }
        .btn-submit {
            background-color: var(--success-color);
            color: white;
        }
        .btn-excel {
            background-color: var(--dark-color);
            color: white;
        }
        .btn-admin {
            background-color: var(--primary-color);
            color: white;
        }
        .status-msg {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
            text-align: center;
            display: none;
            word-break: break-word;
        }
        .status-success { background: #d4edda; color: #155724; }
        .status-error { background: #f8d7da; color: #721c24; }

        /* ADMIN PANELİ STİLLERİ */
        #adminPanel {
            display: none;
            margin-top: 30px;
            border-top: 3px solid var(--primary-color);
            padding-top: 20px;
        }
        .admin-search {
            margin-bottom: 15px;
        }
        .kayit-listesi {
            list-style: none;
        }
        .kayit-item {
            border: 1px solid #eee;
            background: #fafafa;
            border-radius: 8px;
            padding: 12px 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .kayit-bilgi {
            font-size: 13px;
            line-height: 1.6;
            flex: 1;
            min-width: 200px;
        }
        .kayit-bilgi strong {
            color: var(--dark-color);
            font-size: 14px;
        }
        .btn-sil {
            background-color: var(--danger-color);
            color: white;
            width: auto;
            padding: 8px 14px;
            font-size: 13px;
            margin-top: 0;
            flex-shrink: 0;
        }
        .admin-kapat {
            text-align: center;
            margin-top: 15px;
            color: #3498db;
            cursor: pointer;
            font-size: 14px;
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>BHKM KURAL İHLAL TAKİP FORMU</h1>
        <p>Operasyonel kurallara uyum ve personel bildirim ekranı</p>
    </div>

    <form id="kuralForm">
        <div class="section-title">İhlal Eden Personel Bilgileri</div>
        <div class="form-grid">
            <div class="form-group">
                <label for="sicil">Sicil Numarası</label>
                <input type="text" id="sicil" required placeholder="Sicil yazıp bekleyin...">
            </div>
            <div class="form-group">
                <label for="isim_soyisim">İsim Soyisim</label>
                <input type="text" id="isim_soyisim" required readonly placeholder="Otomatik dolacak">
            </div>
            <div class="form-group">
                <label for="unvan">Ünvanı</label>
                <input type="text" id="unvan" required readonly placeholder="Otomatik dolacak">
            </div>
            <div class="form-group">
                <label for="ekibi">Ekibi / Postası</label>
                <input type="text" id="ekibi" required readonly placeholder="Otomatik dolacak">
            </div>
            <div class="form-group">
                <label for="tarih">İhlal Tarihi</label>
                <input type="date" id="tarih" required>
            </div>
            <div class="form-group">
                <label for="kural_ihlali">Kural İhlali Türü</label>
                <select id="kural_ihlali" required>
                    <option value="">-- Seçiniz --</option>
                    <option value="APRON EHLİYETİ VE SİVİL EHLİYETİ YANINDA BULUNDURMAMAK">APRON EHLİYETİ VE SİVİL EHLİYETİ YANINDA BULUNDURMAMAK</option>
                    <option value="ARAÇ DEFTERİ YAZMAMAK">ARAÇ DEFTERİ YAZMAMAK</option>
                    <option value="ARAÇ TERK ETME PROSEDÜRÜNE UYMAMAK">ARAÇ TERK ETME PROSEDÜRÜNE UYMAMAK</option>
                    <option value="ARAÇ ÜZERİNDE ANAHTAR BIRAKMAK">ARAÇ ÜZERİNDE ANAHTAR BIRAKMAK</option>
                    <option value="ÇALIŞIR VAZİYETTE ARAÇ BIRAKMAK">ÇALIŞIR VAZİYETTE ARAÇ BIRAKMAK</option>
                    <option value="ÇEKİCİ SIRTINDA KAPASİTE FAZLASI YÜK TAŞIMAK">ÇEKİCİ SIRTINDA KAPASİTE FAZLASI YÜK TAŞIMAK</option>
                    <option value="DÖNÜŞ VE GEÇİŞ KURALLARINA UYMAMAK">DÖNÜŞ VE GEÇİŞ KURALLARINA UYMAMAK</option>
                    <option value="EMNİYET KEMERİ TAKMAMAK">EMNİYET KEMERİ TAKMAMAK</option>
                    <option value="EMNİYETSİZ OPERASYON (BAGAJ-EKİPMAN BIRAKMAK)">EMNİYETSİZ OPERASYON (BAGAJ-EKİPMAN BIRAKMAK)</option>
                    <option value="GERİ MANEVRADA MARSHALLING YARDIMI ALMAMAK">GERİ MANEVRADA MARSHALLING YARDIMI ALMAMAK</option>
                    <option value="HASARLI EKİPMAN KULLANMAK">HASARLI EKİPMAN KULLANMAK</option>
                    <option value="HIZ SINIR IHLALİ">HIZ SINIR IHLALİ</option>
                    <option value="KANAT ALTI İHLALİ">KANAT ALTI İHLALİ</option>
                    <option value="KAPISI AÇIK ARAÇ KULLANMAK">KAPISI AÇIK ARAÇ KULLANMAK</option>
                    <option value="KAPASİTE FAZLASI EKİPMAN TAŞIMAK">KAPASİTE FAZLASI EKİPMAN TAŞIMAK</option>
                    <option value="SEYİR HALİNDE TELEFON İLE GÖRÜŞME">SEYİR HALİNDE TELEFON İLE GÖRÜŞME</option>
                    <option value="TERS YÖNDE ARAÇ KULLANMAK">TERS YÖNDE ARAÇ KULLANMAK</option>
                    <option value="UYGUNSUZ ARAÇ PARK ETMEK">UYGUNSUZ ARAÇ PARK ETMEK</option>
                    <option value="UYGUNSUZ MALZEME TAŞIMAK">UYGUNSUZ MALZEME TAŞIMAK</option>
                    <option value="YELEKSİZ ARAÇ KULLANMAK">YELEKSİZ ARAÇ KULLANMAK</option>
                </select>
            </div>
        </div>

        <div class="section-title">Tespit Eden / Raporlayan Bilgileri</div>
        <div class="form-grid">
            <div class="form-group">
                <label for="tespit_eden_sicil">Sizin Siciliniz</label>
                <input type="text" id="tespit_eden_sicil" required placeholder="Sicil yazıp bekleyin...">
            </div>
            <div class="form-group">
                <label for="tespit_eden_isim">Sizin İsim Soyisminiz</label>
                <input type="text" id="tespit_eden_isim" required readonly placeholder="Otomatik dolacak">
            </div>
        </div>

        <div class="btn-group">
            <button type="submit" class="btn-submit">Veritabanına Kaydet</button>
            <button type="button" id="btnExcel" class="btn-excel">Excel Raporu İndir (Şifreli)</button>
            <button type="button" id="btnAdmin" class="btn-admin">Yönetici Paneli (Kayıt Sil)</button>
        </div>
    </form>

    <div id="statusMsg" class="status-msg"></div>

    <!-- ADMIN PANELİ: KAYITLARI LİSTELE VE SİL -->
    <div id="adminPanel">
        <div class="section-title">Yönetici Paneli - Kayıtlı İhlaller</div>
        <input type="text" id="adminArama" class="admin-search" placeholder="🔍 Sicil, isim veya ihlal türüne göre ara...">
        <ul id="kayitListesi" class="kayit-listesi"></ul>
        <div id="adminKapat" class="admin-kapat">Yönetici panelini kapat</div>
    </div>
</div>

<script>
    const SUPABASE_URL = "https://rnlzklchhdndlzgmatkw.supabase.co";
    const SUPABASE_KEY = "sb_publishable_k61-JSZFN2npZfZWiR05Ng_lqAV8Jiu"; 
    const ADMIN_SIFRE = "bhkm2026";

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const form = document.getElementById('kuralForm');
    const statusMsg = document.getElementById('statusMsg');
    const btnExcel = document.getElementById('btnExcel');
    const btnAdmin = document.getElementById('btnAdmin');
    const adminPanel = document.getElementById('adminPanel');
    const adminKapat = document.getElementById('adminKapat');
    const kayitListesi = document.getElementById('kayitListesi');
    const adminArama = document.getElementById('adminArama');

    const sicilInput = document.getElementById('sicil');
    const isimInput = document.getElementById('isim_soyisim');
    const unvanInput = document.getElementById('unvan');
    const ekibiInput = document.getElementById('ekibi');
    const tespitSicilInput = document.getElementById('tespit_eden_sicil');
    const tespitIsimInput = document.getElementById('tespit_eden_isim');

    let tumKayitlar = [];

    // Bugünün tarihini varsayılan seçtir
    document.getElementById('tarih').valueAsDate = new Date();

    // ========================================================
    // OTOMATİK SİCİL SORGULAMA
    // ========================================================
    
    // İhlal Eden Canlı Arama
    sicilInput.addEventListener('input', async () => {
        const girilenSicil = sicilInput.value.trim();
        if (girilenSicil.length >= 3) {
            const { data, error } = await supabaseClient
                .from('personeller')
                .select('*')
                .eq('SİCİL', girilenSicil);

            if (data && data.length > 0 && !error) {
                const personel = data[0];
                isimInput.value = personel['İSİM'] || '';
                unvanInput.value = personel['UNVAN'] || '';
                ekibiInput.value = personel['EKİBİ'] || '';
            } else {
                isimInput.value = ''; unvanInput.value = ''; ekibiInput.value = '';
            }
        } else {
            isimInput.value = ''; unvanInput.value = ''; ekibiInput.value = '';
        }
    });

    // Tespit Eden Canlı Arama
    tespitSicilInput.addEventListener('input', async () => {
        const girilenTespitSicil = tespitSicilInput.value.trim();
        if (girilenTespitSicil.length >= 3) {
            const { data, error } = await supabaseClient
                .from('personeller')
                .select('*')
                .eq('SİCİL', girilenTespitSicil);

            if (data && data.length > 0 && !error) {
                tespitIsimInput.value = data[0]['İSİM'] || '';
            } else {
                tespitIsimInput.value = '';
            }
        } else {
            tespitIsimInput.value = '';
        }
    });

    // ========================================================
    // 1. VERİBATANINA KAYDETME
    // ========================================================
    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        statusMsg.style.display = 'none';

        if (!isimInput.value || !tespitIsimInput.value) {
            alert("Lütfen sistemde kayıtlı geçerli sicil numaraları giriniz!");
            return;
        }

        const formData = {
            sicil: sicilInput.value.trim(),
            isim_soyisim: isimInput.value,
            unvan: unvanInput.value,
            ekibi: ekibiInput.value,
            kural_ihlali: document.getElementById('kural_ihlali').value,
            tarih: document.getElementById('tarih').value,
            tespit_eden_sicil: tespitSicilInput.value.trim(),
            tespit_eden_isim: tespitIsimInput.value
        };

        const { data, error } = await supabaseClient
            .from('kural_ihlalleri')
            .upsert([formData], { onConflict: 'sicil,tarih' });

        if (error) {
            statusMsg.textContent = "Hata oluştu: " + error.message;
            statusMsg.className = "status-msg status-error";
            statusMsg.style.display = 'block';
        } else {
            statusMsg.textContent = "Kayıt başarıyla veritabanına işlendi / güncellendi!";
            statusMsg.className = "status-msg status-success";
            statusMsg.style.display = 'block';
            
            // Temizleme işlemleri
            sicilInput.value = '';
            isimInput.value = '';
            unvanInput.value = '';
            ekibiInput.value = '';
        }
    });

    // ========================================================
    // 2. EXCEL İNDİRME (ŞİFRE KORUMALI)
    // ========================================================
    btnExcel.addEventListener('click', async () => {
        const sfre = prompt("Excel raporunu indirmek için yönetici şifresini giriniz:");
        
        if (sfre !== ADMIN_SIFRE) {
            alert("Hatalı şifre girdiniz! Yetkiniz yok.");
            return;
        }

        const { data, error } = await supabaseClient
            .from('kural_ihlalleri')
            .select('tarih, sicil, isim_soyisim, unvan, ekibi, kural_ihlali, tespit_eden_isim')
            .order('tarih', { ascending: false });

        if (error) {
            alert("Veriler çekilirken bir hata oluştu: " + error.message);
            return;
        }

        if (!data || data.length === 0) {
            alert("Veritabanında indirilecek herhangi bir kayıt bulunamadı!");
            return;
        }

        const excelData = data.map(row => ({
            "TARİH": row.tarih,
            "SİCİL": row.sicil,
            "İSİM SOYİSİM": row.isim_soyisim,
            "ÜNVAN": row.unvan,
            "EKİBİ": row.ekibi,
            "KURAL İHLALİ": row.kural_ihlali,
            "TESPİT EDEN": row.tespit_eden_isim
        }));

        const worksheet = XLSX.utils.json_to_sheet(excelData);
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "Kural İhlalleri");

        const colWidths = [{wch: 12}, {wch: 10}, {wch: 22}, {wch: 15}, {wch: 15}, {wch: 45}, {wch: 22}];
        worksheet['!cols'] = colWidths;

        const dosyaAdi = `kural_ihlalleri_${new Date().toISOString().slice(0,10)}.xlsx`;
        XLSX.writeFile(workbook, dosyaAdi);
    });

    // ========================================================
    // 3. YÖNETİCİ PANELİ - KAYIT SİLME (ŞİFRE KORUMALI)
    // ========================================================
    btnAdmin.addEventListener('click', async () => {
        const sfre = prompt("Yönetici paneline girmek için şifreyi giriniz:");

        if (sfre !== ADMIN_SIFRE) {
            alert("Hatalı şifre girdiniz! Yetkiniz yok.");
            return;
        }

        adminPanel.style.display = 'block';
        await kayitlariYukle();
        adminPanel.scrollIntoView({ behavior: 'smooth' });
    });

    adminKapat.addEventListener('click', () => {
        adminPanel.style.display = 'none';
        adminArama.value = '';
    });

    async function kayitlariYukle() {
        kayitListesi.innerHTML = '<p style="text-align:center; color:#888; padding:15px">Yükleniyor...</p>';

        const { data, error } = await supabaseClient
            .from('kural_ihlalleri')
            .select('*')
            .order('tarih', { ascending: false });

        if (error) {
            kayitListesi.innerHTML = `<p style="text-align:center; color:#e74c3c; padding:15px">Hata: ${error.message}</p>`;
            return;
        }

        tumKayitlar = data || [];
        renderKayitlar(tumKayitlar);
    }

    function renderKayitlar(data) {
        kayitListesi.innerHTML = '';

        if (data.length === 0) {
            kayitListesi.innerHTML = '<p style="text-align:center; color:#888; padding:15px">Kayıt bulunamadı.</p>';
            return;
        }

        data.forEach(kayit => {
            const li = document.createElement('li');
            li.className = 'kayit-item';

            const bilgi = document.createElement('div');
            bilgi.className = 'kayit-bilgi';
            bilgi.innerHTML = `
                <strong>${kayit.isim_soyisim || '-'}</strong> (Sicil: ${kayit.sicil || '-'})<br>
                Tarih: ${kayit.tarih || '-'} • Ünvan: ${kayit.unvan || '-'} • Ekip: ${kayit.ekibi || '-'}<br>
                İhlal: ${kayit.kural_ihlali || '-'}<br>
                Tespit Eden: ${kayit.tespit_eden_isim || '-'}
            `;

            const silBtn = document.createElement('button');
            silBtn.textContent = 'Sil';
            silBtn.className = 'btn-sil';
            silBtn.onclick = async () => {
                if (!confirm(`${kayit.isim_soyisim} (${kayit.tarih}) tarihli kayıt silinsin mi?`)) return;

                const { error } = await supabaseClient
                    .from('kural_ihlalleri')
                    .delete()
                    .eq('id', kayit.id);

                if (error) {
                    alert("Silme sırasında hata oluştu: " + error.message);
                } else {
                    await kayitlariYukle();
                }
            };

            li.appendChild(bilgi);
            li.appendChild(silBtn);
            kayitListesi.appendChild(li);
        });
    }

    adminArama.addEventListener('input', (e) => {
        const v = e.target.value.toLowerCase();
        const filtreli = tumKayitlar.filter(k =>
            (k.sicil || '').toLowerCase().includes(v) ||
            (k.isim_soyisim || '').toLowerCase().includes(v) ||
            (k.kural_ihlali || '').toLowerCase().includes(v) ||
            (k.tespit_eden_isim || '').toLowerCase().includes(v)
        );
        renderKayitlar(filtreli);
    });
</script>

</body>
</html>
